[package]
name = "redforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Local-first redstone circuit CAD and simulator"
license = "MIT"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_log", "bevy_window", "bevy_winit", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_picking", "mesh_picking", "multi_threaded"] }
bevy_egui = { version = "=0.42.0", default-features = false, features = ["default_fonts", "render", "picking"] }
diplomat-runtime = "0.15"
nucleation = { git = "https://github.com/Schem-at/Nucleation.git", rev = "04a4753fe73167888eb6372fd23678d818d22b56", default-features = false, features = ["bridge", "mc-tick"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
